services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: hr
      POSTGRES_DB: hr
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - dbdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://hr:hr@db:5432/hr
      RATE_LIMIT_PER_SECOND: "10"
      RATE_LIMIT_BURST: "20"
      MAX_PAGE_SIZE: "100"
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  dbdata:
